name: tenXer *
description: 'tenXer was a San Francisco productivity-analytics startup that helped
  engineering leads measure and improve team performance by pulling data from the
  tools engineers already used (GitHub, JIRA, Pivotal Tracker, etc.) and turning it
  into manager-facing views, stats and insights. Backed by True Ventures, GV (Google
  Ventures) and Khosla Ventures (~$5M raised), the company was acquired by Twitter
  in April 2015 for under $50M and folded into Twitter''s internal engineering-tools
  effort. The standalone product and public developer surface no longer exist; this
  profile is retained in the API Evangelist network as a portfolio-lead stub. No live
  API, developer portal, or documentation was found during enrichment.'
